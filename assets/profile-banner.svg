<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Nilson Cruz — desenvolvedor web</title>
  <desc id="desc">Banner escuro com tipografia clara, detalhes verdes inspirados no Dead Idle MMO e um monograma geométrico NC.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9cdd64"/>
      <stop offset="1" stop-color="#6e9f43"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fc997" stroke-width="1" opacity=".08"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <path d="M0 0h1200v320H0z" fill="none" stroke="#303d35" stroke-width="2"/>
    <path d="M0 6h320M0 314h430" stroke="url(#line)" stroke-width="5"/>

    <path d="M775 0h425v320H715z" fill="#111917" opacity=".68"/>
    <path d="M830 0L650 320M932 0L752 320M1034 0L854 320" stroke="#9cdd64" stroke-width="1" opacity=".09"/>
    <path d="M898 48h210l46 46v132l-46 46H898l-46-46V94z" fill="#151f19" stroke="#3e5d3e" stroke-width="2"/>
    <path d="M898 48h108M1148 94v75M1108 272h-81M852 226v-76" fill="none" stroke="url(#line)" stroke-width="4"/>
    <path d="M911 85h185l23 23v104l-23 23H911l-23-23V108z" fill="none" stroke="#52734a" stroke-width="1" opacity=".7"/>
    <text x="1003" y="183" text-anchor="middle" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="80" font-weight="700" letter-spacing="-6">NC</text>
    <circle cx="852" cy="150" r="5" fill="#9cdd64"/>
    <circle cx="1148" cy="169" r="5" fill="#6e9f43"/>

    <rect x="56" y="49" width="9" height="9" fill="#9cdd64"/>
    <text x="80" y="59" fill="#a8d985" font-family="Cascadia Code, Consolas, monospace" font-size="17" letter-spacing="2">DESENVOLVEDOR WEB</text>
    <text x="52" y="168" fill="#e6edf3" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="-2">Nilson Cruz</text>
    <path d="M56 191h545" stroke="#34453b" stroke-width="2"/>
    <path d="M56 191h152" stroke="url(#line)" stroke-width="4"/>
    <text x="56" y="233" fill="#b7c9ba" font-family="Segoe UI, Arial, sans-serif" font-size="23">Educação  /  Automação  /  Jogos</text>
    <path d="M56 269h13m11 0h13m11 0h13" stroke="#9cdd64" stroke-width="3" stroke-linecap="square"/>
    <text x="136" y="274" fill="#8da78f" font-family="Cascadia Code, Consolas, monospace" font-size="14" letter-spacing="1">github.com/deadidlemmo</text>
